<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" width="1160" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="PAIR pipeline: a language model reads the denial, finds evidence and drafts the letter; code picks the checklist, decides each requirement, verifies every sentence and scores strength or says get a human."><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a414a"/></marker></defs><rect width="1160" height="380" rx="20" fill="#0d1117"/><text x="32" y="40" font-size="12" fill="#9aa4ae">In: denial letter + medical records (PDF, photo or text)</text><rect x="16" y="52" width="1128" height="132" rx="18" fill="#161b22"/><text x="32" y="100" font-size="12" font-weight="700" fill="#f1c76a">Language model</text><text x="32" y="117" font-size="11" fill="#9aa4ae">reads and words</text><rect x="16" y="196" width="1128" height="132" rx="18" fill="#161b22"/><text x="32" y="244" font-size="12" font-weight="700" fill="#8fd3ad">Code and checks</text><text x="32" y="261" font-size="11" fill="#9aa4ae">decide and verify</text><path d="M258,118.0 C263.0,118.0 263.0,262.0 264,262.0" fill="none" stroke="#3a414a" stroke-width="2" marker-end="url(#ah)"/><path d="M376,262.0 C381.0,262.0 381.0,118.0 382,118.0" fill="none" stroke="#3a414a" stroke-width="2" marker-end="url(#ah)"/><path d="M494,118.0 C499.0,118.0 499.0,262.0 500,262.0" fill="none" stroke="#3a414a" stroke-width="2" marker-end="url(#ah)"/><path d="M612,262.0 C617.0,262.0 617.0,118.0 618,118.0" fill="none" stroke="#3a414a" stroke-width="2" marker-end="url(#ah)"/><path d="M730,118.0 C735.0,118.0 735.0,262.0 736,262.0" fill="none" stroke="#3a414a" stroke-width="2" marker-end="url(#ah)"/><path d="M848,262.0 C853.0,262.0 853.0,262.0 854,262.0" fill="none" stroke="#3a414a" stroke-width="2" marker-end="url(#ah)"/><path d="M966,262.0 L972,262.0" stroke="#3a414a" stroke-width="2" marker-end="url(#ah)"/><rect x="150" y="70" width="108" height="96" rx="14" fill="#3a2e14"/><circle cx="166" cy="86" r="10" fill="#f1c76a"/><text x="166" y="90" font-size="11" font-weight="700" fill="#0d1117" text-anchor="middle">1</text><text x="160" y="114" font-size="12.5" font-weight="700" fill="#e6edf3">Read the</text><text x="160" y="129" font-size="12.5" font-weight="700" fill="#e6edf3">denial</text><text x="160" y="146" font-size="10.5" fill="#9aa4ae">service, codes,</text><text x="160" y="159" font-size="10.5" fill="#9aa4ae">reason</text><rect x="268" y="214" width="108" height="96" rx="14" fill="#1d3528"/><circle cx="284" cy="230" r="10" fill="#8fd3ad"/><text x="284" y="234" font-size="11" font-weight="700" fill="#0d1117" text-anchor="middle">2</text><text x="278" y="258" font-size="12.5" font-weight="700" fill="#e6edf3">Pick the</text><text x="278" y="273" font-size="12.5" font-weight="700" fill="#e6edf3">checklist</text><text x="278" y="290" font-size="10.5" fill="#9aa4ae">NCD / LCD as YAML</text><text x="278" y="303" font-size="10.5" fill="#9aa4ae">rules</text><rect x="386" y="70" width="108" height="96" rx="14" fill="#3a2e14"/><circle cx="402" cy="86" r="10" fill="#f1c76a"/><text x="402" y="90" font-size="11" font-weight="700" fill="#0d1117" text-anchor="middle">3</text><text x="396" y="114" font-size="12.5" font-weight="700" fill="#e6edf3">Find evidence</text><text x="396" y="131" font-size="10.5" fill="#9aa4ae">quotes with exact</text><text x="396" y="144" font-size="10.5" fill="#9aa4ae">offsets</text><rect x="504" y="214" width="108" height="96" rx="14" fill="#1d3528"/><circle cx="520" cy="230" r="10" fill="#8fd3ad"/><text x="520" y="234" font-size="11" font-weight="700" fill="#0d1117" text-anchor="middle">4</text><text x="514" y="258" font-size="12.5" font-weight="700" fill="#e6edf3">Rule engine</text><text x="514" y="275" font-size="10.5" fill="#9aa4ae">met / not met /</text><text x="514" y="288" font-size="10.5" fill="#9aa4ae">not sure</text><rect x="622" y="70" width="108" height="96" rx="14" fill="#3a2e14"/><circle cx="638" cy="86" r="10" fill="#f1c76a"/><text x="638" y="90" font-size="11" font-weight="700" fill="#0d1117" text-anchor="middle">5</text><text x="632" y="114" font-size="12.5" font-weight="700" fill="#e6edf3">Draft the</text><text x="632" y="129" font-size="12.5" font-weight="700" fill="#e6edf3">letter</text><text x="632" y="146" font-size="10.5" fill="#9aa4ae">one claim per</text><text x="632" y="159" font-size="10.5" fill="#9aa4ae">sentence</text><rect x="740" y="214" width="108" height="96" rx="14" fill="#1d3528"/><circle cx="756" cy="230" r="10" fill="#8fd3ad"/><text x="756" y="234" font-size="11" font-weight="700" fill="#0d1117" text-anchor="middle">6</text><text x="750" y="258" font-size="12.5" font-weight="700" fill="#e6edf3">Verify every</text><text x="750" y="273" font-size="12.5" font-weight="700" fill="#e6edf3">sentence</text><text x="750" y="290" font-size="10.5" fill="#9aa4ae">span → MiniCheck</text><text x="750" y="303" font-size="10.5" fill="#9aa4ae">→ conformal</text><rect x="858" y="214" width="108" height="96" rx="14" fill="#1d3528"/><circle cx="874" cy="230" r="10" fill="#8fd3ad"/><text x="874" y="234" font-size="11" font-weight="700" fill="#0d1117" text-anchor="middle">7</text><text x="868" y="258" font-size="12.5" font-weight="700" fill="#e6edf3">Strength or</text><text x="868" y="273" font-size="12.5" font-weight="700" fill="#e6edf3">get a human</text><text x="868" y="290" font-size="10.5" fill="#9aa4ae">IMR model, or</text><text x="868" y="303" font-size="10.5" fill="#9aa4ae">abstains</text><rect x="976" y="70" width="152" height="240" rx="16" fill="#1f9e7e"/><text x="990" y="100" font-size="13" font-weight="700" fill="#0d1117">8  For the patient</text><text x="990" y="119" font-size="11.5" font-weight="400" fill="#0d1117">Why they said no</text><text x="990" y="138" font-size="11.5" font-weight="400" fill="#0d1117">Where you stand</text><text x="990" y="157" font-size="11.5" font-weight="400" fill="#0d1117">What's missing</text><text x="990" y="176" font-size="11.5" font-weight="400" fill="#0d1117">Cited letter</text><text x="990" y="195" font-size="11.5" font-weight="400" fill="#0d1117">Your chances</text><text x="990" y="214" font-size="11.5" font-weight="400" fill="#0d1117">Word + PDF</text><text x="32" y="358" font-size="11.5" fill="#9aa4ae">The model never decides coverage. Every letter sentence must quote a record span and a policy clause, or it is kept out.</text></svg>