[project]
name = "pair"
version = "0.1.0"
description = "Patient-side appeal copilot for Medicare Advantage prior authorization denials."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nithin Reddy" }]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/pair"]
branch = true

[tool.coverage.report]
show_missing = true
