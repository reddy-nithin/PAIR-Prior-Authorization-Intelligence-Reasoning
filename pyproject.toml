[project]
name = "pair"
version = "0.1.0"
description = "Patient-side appeal copilot for Medicare Advantage prior authorization denials."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nithin Reddy" }]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.31.0",
    "langextract==1.7.1",
    "pandas>=3.0.6",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
]

[project.scripts]
pair = "pair.cli:entry"

[project.optional-dependencies]
ocr = [
    "docling==2.140.0",
    "ocrmac>=1.0.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8",
    "pytest-cov>=5",
    "scipy-stubs>=1.17.1.5",
    "types-pyyaml>=6.0.12.20260906",
    "venn-abers>=1.5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "mcd: needs the MCD export in data/raw/mcd (run `make data`); skipped if absent",
    "imr: needs the IMR CSV in data/raw/imr (run `make data`); skipped if absent",
    "docling: needs the optional `ocr` extra (Docling); skipped if absent",
    "llm: calls a real LLM backend (lab tunnel or Vertex); skipped unless PAIR_LLM_LIVE=1",
]

[tool.coverage.run]
source = ["src/pair"]
branch = true

[tool.coverage.report]
show_missing = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "venn_abers.*"]
ignore_missing_imports = true
